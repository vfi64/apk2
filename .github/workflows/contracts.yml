name: Acceptance contracts

on:
  pull_request:
  push:
    branches: [main, codex/acceptance-contracts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run local Git contract examples
        run: python -B -m unittest discover -s tests -v

  rust-gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting and lints
        run: |
          cargo +stable fmt --check
          cargo +stable clippy --locked --offline --all-targets -- -D warnings
      - name: Test the built release CLI in fresh local Git repositories
        run: cargo +stable test --release --locked --offline
